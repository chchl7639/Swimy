<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>스위미</title>
<style>
  :root {
    --swimi-color: #6c8cff;   /* 스위미 색상 (단색) */
    --swimi-size: 64px;       /* 스위미 크기 */
    --bg: #f4f6fb;
    --bubble-bg: #ffffff;
    --bubble-text: #2b2f3a;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14161c; --bubble-bg: #2a2e3a; --bubble-text: #eef0f6; }
  }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg);
    font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none;
    touch-action: manipulation;
  }

  /* 1) 위치 담당 (이동은 JS가 transform으로 제어) */
  #swimi {
    position: absolute; left: 0; top: 0;
    width: var(--swimi-size); height: var(--swimi-size);
    transition-property: transform;
    transition-timing-function: ease-in-out;
    cursor: pointer;
  }
  /* 2) 걷기 애니메이션 담당 */
  .walk { width: 100%; height: 100%; }
  #swimi.walking .walk { animation: walk 0.5s ease-in-out infinite; }
  /* 3) 외형 + 터치 반응 담당 */
  .body {
    width: 100%; height: 100%; border-radius: 50%;
    background: var(--swimi-color);
    transform-origin: 50% 100%;
  }
  .body.bounce { animation: bounce 0.55s ease-out; }

  /* 바닥 그림자 */
  .shadow {
    position: absolute; left: 12%; right: 12%; bottom: -6px; height: 8px;
    border-radius: 50%; background: rgba(0,0,0,.12); z-index: -1;
  }

  /* 말풍선 */
  .bubble {
    position: absolute; bottom: calc(100% + 10px); left: 50%;
    transform: translateX(-50%);
    background: var(--bubble-bg); color: var(--bubble-text);
    padding: 8px 12px; border-radius: 12px; font-size: 14px;
    white-space: nowrap; box-shadow: 0 2px 8px rgba(0,0,0,.12);
    opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  .bubble.show { opacity: 1; }

  @keyframes walk {
    0%, 100% { transform: translateY(0) rotate(-4deg); }
    25%      { transform: translateY(-5px) rotate(0deg); }
    50%      { transform: translateY(0) rotate(4deg); }
    75%      { transform: translateY(-5px) rotate(0deg); }
  }
  @keyframes bounce {
    0%   { transform: scale(1, 1); }
    20%  { transform: scale(1.08, 0.9); }
    50%  { transform: translateY(-18px) scale(0.96, 1.05); }
    75%  { transform: translateY(0) scale(1.05, 0.95); }
    100% { transform: scale(1, 1); }
  }
  @media (prefers-reduced-motion: reduce) {
    #swimi.walking .walk, .body.bounce { animation: none; }
  }
</style>
</head>
<body>

<div id="swimi" aria-label="스위미" role="button">
  <div class="bubble" id="bubble"></div>
  <div class="shadow"></div>
  <div class="walk"><div class="body" id="body"></div></div>
</div>

<script>
(() => {
  // ───── 설정 ─────
  const PHRASES = [            // 터치 시 나오는 문구 (3개)
    "안녕! 나 여기 있어~",
    "간질간질해, 헤헤",
    "오늘도 같이 힘내자!"
  ];
  const MOVE_WAIT = [2000, 5000];   // 다음 이동까지 대기 시간(ms) 범위
  const MOVE_DIST = [60, 160];      // 한 번 이동 거리(px) 범위
  const SPEED = 70;                 // 이동 속도(px/초)
  const BUBBLE_MS = 2000;           // 말풍선 유지 시간

  // ───── 요소 ─────
  const pet = document.getElementById('swimi');
  const body = document.getElementById('body');
  const bubble = document.getElementById('bubble');
  const SIZE = pet.offsetWidth;
  const rand = (a, b) => a + Math.random() * (b - a);

  let x = 0, y = 0, lastPhrase = -1, bubbleTimer = null;

  // 화면 안으로 좌표 제한 (위쪽은 말풍선 공간 확보)
  const clamp = (nx, ny) => [
    Math.min(Math.max(nx, 8), innerWidth - SIZE - 8),
    Math.min(Math.max(ny, 70), innerHeight - SIZE - 16)
  ];

  function place(nx, ny, ms) {
    [x, y] = clamp(nx, ny);
    pet.style.transitionDuration = ms + 'ms';
    pet.style.transform = `translate(${x}px, ${y}px)`;
  }

  // ───── 랜덤 이동 ─────
  function scheduleMove() {
    setTimeout(walkOnce, rand(...MOVE_WAIT));
  }
  function walkOnce() {
    const angle = rand(0, Math.PI * 2);          // 무작위 방향
    const dist = rand(...MOVE_DIST);
    const [tx, ty] = clamp(x + Math.cos(angle) * dist, y + Math.sin(angle) * dist);
    const real = Math.hypot(tx - x, ty - y);
    if (real < 20) return scheduleMove();        // 벽에 막혀 거의 못 가면 건너뜀
    const ms = (real / SPEED) * 1000;
    pet.classList.add('walking');
    place(tx, ty, ms);
    setTimeout(() => {
      pet.classList.remove('walking');
      scheduleMove();
    }, ms);
  }

  // ───── 터치 반응 ─────
  function say(text) {
    bubble.textContent = text;
    bubble.style.transform = 'translateX(-50%)';
    const r = bubble.getBoundingClientRect();     // 화면 밖으로 나가면 보정
    let shift = 0;
    if (r.left < 8) shift = 8 - r.left;
    else if (r.right > innerWidth - 8) shift = innerWidth - 8 - r.right;
    bubble.style.transform = `translateX(calc(-50% + ${shift}px))`;
    bubble.classList.add('show');
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(() => bubble.classList.remove('show'), BUBBLE_MS);
  }
  function onTouch() {
    let i;
    do { i = Math.floor(Math.random() * PHRASES.length); } while (i === lastPhrase);
    lastPhrase = i;
    say(PHRASES[i]);
    body.classList.remove('bounce');
    void body.offsetWidth;                        // 애니메이션 재시작
    body.classList.add('bounce');
  }
  pet.addEventListener('pointerdown', onTouch);

  // ───── 시작 ─────
  addEventListener('resize', () => place(x, y, 0));
  place(innerWidth / 2 - SIZE / 2, innerHeight / 2 - SIZE / 2, 0);
  scheduleMove();
})();
</script>
</body>
</html>
